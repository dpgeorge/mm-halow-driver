[tool.codespell]
skip = """
./.git,\
./lib,\
"""

[tool.ruff]
# Exclude third-party code from linting and formatting
extend-exclude = [
  "lib",
]
line-length = 99
target-version = "py38"

[tool.ruff.lint]
extend-select = [
  "C9",
  "PLC",
  "W292",
]
ignore = [
  "UP031",
  "BLE001",
  "S110",
  "PLR1730",
]
mccabe.max-complexity = 40
